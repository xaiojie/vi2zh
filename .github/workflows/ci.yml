name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          for f in src/*.js src/shared/*.js tools/*.js; do node --check "$f"; done
      - name: Unit tests
        run: node tools/test-unit.js
      - name: Build extension
        run: node tools/build.js --no-bump
      - uses: actions/upload-artifact@v4
        with:
          name: vi2zh-dist
          path: dist/vi2zh-translator
